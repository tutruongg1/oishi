<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Oishi</title>
<link rel="icon" href="https://media.gametora.com/umamusume/characters/chibi/101901_0010.png">
<link rel="apple-touch-icon" href="https://media.gametora.com/umamusume/characters/chibi/101901_0010.png">
<style>
:root{--bg:#17181c;--p:#1f2026e6;--p2:#26272f;--ln:#33343d;--fg:#f1f1f4;--mu:#9a9caa;--pink:#ff6aa9;--org:#ff9b4a;--gold:#ffc83d;--grn:#3ccf8e;--bad:#ff6b6b;--blu:#5aa8ff;--pur:#b48cff;--f:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;color:var(--fg);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;background:var(--bg) linear-gradient(180deg,rgba(23,24,28,.25),rgba(23,24,28,.92) 340px,var(--bg) 520px) no-repeat;background-image:linear-gradient(180deg,rgba(23,24,28,.25),rgba(23,24,28,.92) 340px,var(--bg) 520px),url("https://umamusu.wiki/w/images/4/40/Bg_0110_00130.png");background-size:100% 100%,cover;background-position:top center;background-attachment:scroll}
.wrap{max-width:540px;margin:0 auto;padding:0 14px calc(30px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:5;margin:0 -14px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:rgba(23,24,28,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px}
.bar .digi{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.bar b{font-size:19px;letter-spacing:.3px}.bar b i{font-style:normal;color:var(--pink)}
.bar .up{margin-left:auto;font-size:11.5px;color:var(--mu);text-align:right;line-height:1.3}.stale{color:var(--gold)!important}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px -14px 0;padding:6px 14px 10px;position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:4;background:linear-gradient(rgba(23,24,28,.78),rgba(23,24,28,0))}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:#fff;font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--c);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.hero{position:relative;margin-top:6px;border-radius:22px;padding:18px 18px 14px;background:linear-gradient(140deg,rgba(255,106,169,.28),rgba(31,32,38,.92) 55%);border:1px solid rgba(255,106,169,.35);overflow:hidden;min-height:190px}
.hero .ag{position:absolute;right:-26px;bottom:-30px;height:230px;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.hero>*:not(.ag){position:relative;z-index:1}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#ffd1e4;font-weight:700}
.big{display:flex;align-items:center;gap:8px;font-size:44px;font-weight:900;letter-spacing:-1.2px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.big img{width:38px;height:38px}
.tix{display:flex;gap:16px;margin-top:6px;font-size:13.5px;color:#e9e9ef}.tix b{font-size:16px}
.ol{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:12.5px;color:#d8d8e2;max-width:62%}.ol .neg{color:var(--gold);font-weight:700}
.spark{margin-top:10px;max-width:64%}.spark svg{width:100%;height:58px;display:block}
.spark .ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mu)}
.sec{margin-top:22px}
.sh{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.sh h2{margin:0;font-size:15px;font-weight:800}.sh .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sh span.r{margin-left:auto;font-size:12px;color:var(--mu)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:4px 14px}
.next{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(255,155,74,.5);background:var(--p)}
.bnw{display:flex;width:100%;aspect-ratio:1024/400;background:#2a2b33}.bnw img.bn{width:100%;height:100%;object-fit:cover}.bnw .fb{display:flex;width:100%;height:100%}.bnw .fb img{flex:1;min-width:0;object-fit:cover;object-position:50% 15%}
.next .in{display:flex;align-items:center;gap:12px;padding:12px 14px}
.next .t{min-width:0;flex:1}.next .t b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .t span{font-size:12.5px;color:var(--mu)}
.cd{text-align:center;flex:none;background:linear-gradient(135deg,var(--org),#ff6a3d);border-radius:14px;padding:6px 12px;color:#fff;box-shadow:0 4px 12px rgba(255,120,60,.35)}
.cd b{display:block;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}.cd span{font-size:10.5px;font-weight:700;opacity:.9}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.bc{flex:none;width:78%;scroll-snap-align:start;background:var(--p);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.bc .im{position:relative;aspect-ratio:1024/400;background:#2a2b33;display:flex}
.bc .im img.bn{width:100%;height:100%;object-fit:cover}
.bc .im .fb{display:flex;width:100%;height:100%}.bc .im .fb img{flex:1;min-width:0;object-fit:cover;object-position:50% 15%}
.bc .tg{position:absolute;left:8px;top:8px;display:flex;gap:5px}
.pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;letter-spacing:.3px}
.pill.pull{background:var(--pink)}.pill.u{background:#3b82f6}.pill.s{background:#a46bf5}
.bc .bd{padding:10px 12px}.bc .bd b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .bd span{font-size:12px;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln)}.row:last-child{border-bottom:0}
.row .t{min-width:0;flex:1}.row .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t2{font-size:12px;color:var(--mu)}
.row .r{text-align:right;flex:none;font-size:12px;color:var(--mu)}.row .r b{display:block;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.art{flex:none;width:52px;height:68px;border-radius:10px;object-fit:cover;background:#2a2b33;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.tag{display:inline-block;margin-top:3px;font-size:11px;padding:1px 8px;border-radius:99px;font-weight:700;border:1px solid var(--ln);color:var(--mu)}
.tag.ok{color:var(--grn);border-color:rgba(60,207,142,.55)}.tag.warn{color:var(--gold);border-color:rgba(255,200,61,.55)}.tag.bad{color:var(--bad);border-color:rgba(255,107,107,.55)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ring{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:12px 8px;text-align:center}
.ring svg{width:64px;height:64px;display:block;margin:0 auto}
.ring .v{font-size:13px;font-weight:800;margin-top:4px}.ring .k{font-size:11.5px;color:var(--mu)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ty{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:8px 4px;text-align:center}
.ty img{width:28px;height:28px}.ty b{display:block;font-size:14px;font-variant-numeric:tabular-nums}.ty b small{color:var(--mu);font-weight:600;font-size:11px}
.ty .k{font-size:10.5px;color:var(--mu)}.ty .pb{height:4px;border-radius:9px;background:var(--ln);margin:5px 6px 0;overflow:hidden}.ty .pb i{display:block;height:100%;background:var(--c)}
.cab{background:linear-gradient(180deg,#2b1d14,#1f1712);border:1px solid #4a3324;border-radius:16px;padding:12px 10px 8px}
.shelf{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;border-bottom:6px solid #5a3b25;box-shadow:0 6px 0 -3px #3a2416}.shelf::-webkit-scrollbar{display:none}
.tro{flex:none;width:48px;text-align:center}.tro svg{width:40px;height:52px;display:block;margin:0 auto}
.tro span{font-size:10px;color:#d9c3ae;font-weight:700}
.cst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cst div{background:rgba(0,0,0,.25);border-radius:12px;padding:8px;text-align:center}.cst b{display:block;font-size:18px}.cst span{font-size:11px;color:#d9c3ae}
.ranks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.rk{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:9px 4px;text-align:center}
.rk .k{font-size:11px;color:var(--mu)}.rk .v{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff}
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--mu);line-height:1.6}
.stks{display:flex;justify-content:center;gap:14px;margin:4px 0 10px}
.stk{display:inline-block;padding:4px;background:#fff;border-radius:12px;box-shadow:0 5px 12px rgba(0,0,0,.5)}.stk img{display:block;width:70px;height:70px;border-radius:9px}
.err{margin-top:40vh;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<div class="wrap">
  <div class="err" id="err">Đang tải…</div>
  <main id="app" hidden>
    <div class="bar"><img class="digi" src="https://media.gametora.com/umamusume/characters/chibi/101901_0010.png" alt="" onerror="this.remove()"><b>Oishi<i>.</i></b><div class="up" id="up"></div></div>
    <nav class="chips"><a href="#s-tq" style="--c:#ff6aa9">Tổng quan</a><a href="#s-bn" style="--c:#ff9b4a">Banner</a><a href="#s-mt" style="--c:#3ccf8e">Mục tiêu</a><a href="#s-st" style="--c:#5aa8ff">Sưu tập</a><a href="#s-cm" style="--c:#c9a227">CM</a></nav>

    <section class="hero" id="s-tq">
      <img class="ag" src="https://media.gametora.com/umamusume/characters/render/trainee/idle/101901.png" alt="" onerror="this.remove()">
      <div class="lab">Carat hôm nay</div>
      <div class="big"><img src="https://umamusu.wiki/w/images/6/6d/Jewel_GameIcon.png" alt="" onerror="this.remove()"><span id="carat"></span></div>
      <div class="tix"><span><b id="tu"></b> ticket Uma</span><span><b id="ts"></b> ticket Support</span></div>
      <div class="ol" id="outlook"></div>
      <div class="spark" id="spark"></div>
    </section>

    <section class="sec" id="secNext">
      <div class="sh" style="--c:#ff9b4a"><span class="dot"></span><h2>Pull kế tiếp</h2></div>
      <div id="next"></div>
    </section>

    <section class="sec" id="s-bn">
      <div class="sh" style="--c:#ff9b4a"><span class="dot"></span><h2>Banner sắp tới</h2><span class="r">vuốt ngang →</span></div>
      <div class="hs" id="banners"></div>
    </section>

    <section class="sec" id="s-mt">
      <div class="sh" style="--c:#3ccf8e"><span class="dot"></span><h2>Mục tiêu</h2></div>
      <div class="card" id="goals"></div>
    </section>

    <section class="sec" id="s-st">
      <div class="sh" style="--c:#5aa8ff"><span class="dot"></span><h2>Bộ sưu tập</h2></div>
      <div class="rings" id="rings"></div>
      <div class="types" id="types"></div>
    </section>

    <section class="sec" id="s-cm">
      <div class="sh" style="--c:#c9a227"><span class="dot"></span><h2>Tủ cúp CM</h2></div>
      <div class="cab"><div class="shelf" id="shelf"></div><div class="cst" id="cst"></div></div>
      <div class="ranks" id="ranks"></div>
      <div class="card" id="pvp"></div>
    </section>

    <div class="foot">
      <div class="stks" aria-hidden="true"><span class="stk" style="transform:rotate(-4deg)"><img src="https://umamusu.wiki/w/images/2/2e/Agnes_Digital_1_Party_Dash.gif" alt="" onerror="this.parentNode.remove()"></span><span class="stk" style="transform:rotate(5deg)"><img src="https://umamusu.wiki/w/images/6/69/Agnes_Digital_2_Party_Dash.gif" alt="" onerror="this.parentNode.remove()"></span></div>
      <div id="foot"></div>
    </div>
  </main>
</div>
<script>
"use strict";
const GT = "https://gametora.com/images/umamusume/";
const TYPES = [["Speed", "#3aa8ff"], ["Stamina", "#ff6b5a"], ["Power", "#ffa21f"], ["Guts", "#ff5fa2"], ["Wit", "#33d395"], ["Pal", "#ffc928"], ["Group", "#8bd447"]];
const $ = (s) => document.querySelector(s);
const mk = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const img = (src, c, fb) => { const i = new Image(); i.alt = ""; i.loading = "lazy"; if (c) i.className = c; i.src = src; i.onerror = () => { if (fb && i.src !== fb) i.src = fb; else i.style.visibility = "hidden"; }; return i; };
const fmt = (n) => (n == null ? "—" : Math.round(n).toLocaleString("en-US"));
const D = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const T0 = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const days = (s) => Math.round((D(s) - T0) / 864e5);
const dm = (s) => { const d = D(s); return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`; };
const when = (iso) => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" }); };
const cardSrc = (id, big) => id >= 100000 ? `${GT}characters/chara_stand_${String(id).slice(0, 4)}_${id}.png` : big ? `${GT}supports/tex_support_card_${id}.png` : `${GT}supports/support_card_s_${id}.png`;
const bnSrc = (g) => `${GT}en/gacha/img_bnr_gacha_${g}.png`;
function bannerVisual(b, cls) {
  const box = mk("div", cls);
  const fb = () => { box.replaceChildren(); const f = mk("div", "fb"); (b.ids || []).slice(0, 4).forEach((id) => f.append(img(cardSrc(id, true)))); box.append(f); };
  if (b.g) { const i = img(bnSrc(b.g), "bn"); i.onerror = () => { if (!i.dataset.t) { i.dataset.t = 1; i.src = `${GT}gacha/img_bnr_gacha_${b.g}.png`; } else fb(); }; box.append(i); } else fb();
  return box;
}
function spark(S) {
  const s = S.series || []; if (s.length < 2) return;
  const W = 300, H = 58, v = s.map((x) => x[1]), mn = Math.min(0, ...v), mx = Math.max(...v), y = (b) => H - 4 - ((b - mn) / (mx - mn || 1)) * (H - 10), x = (i) => (i / (s.length - 1)) * W;
  const pts = s.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const lo = v.indexOf(Math.min(...v));
  $("#spark").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Số dư 6 tháng tới"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6aa9" stop-opacity=".45"/><stop offset="1" stop-color="#ff6aa9" stop-opacity="0"/></linearGradient></defs>${mn < 0 ? `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#ff6b6b" stroke-dasharray="4 4" stroke-width="1"/>` : ""}<polygon points="0,${H} ${pts} ${W},${H}" fill="url(#sg)"/><polyline points="${pts}" fill="none" stroke="#ff8cc0" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(lo)}" cy="${y(v[lo])}" r="3.5" fill="#ffc83d"/></svg><div class="ax"><span>Hôm nay</span><span>Số dư 6 tháng tới</span><span>${dm(s[s.length - 1][0])}</span></div>`;
}
function trophy(t) {
  const g = { plat: ["#fff", "#cfe9ff", "#f6d6ff"], gold: ["#fff2a8", "#ffc83d", "#c47a12"], silver: ["#fff", "#c9d3da", "#7f8c96"], bronze: ["#ffd2a6", "#d0864a", "#7a4520"], part: ["#9aa6b2", "#6b7480", "#4a535c"] }[t];
  const id = "tg" + t;
  return `<svg viewBox="0 0 64 84" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset=".5" stop-color="${g[1]}"/><stop offset="1" stop-color="${g[2]}"/></linearGradient></defs><path d="M17 8C9 8 6 12 7 18c1 7 7 12 14 13M47 8c8 0 11 4 10 10-1 7-7 12-14 13" fill="none" stroke="url(#${id})" stroke-width="4"/><path d="M15 5h34v16c0 11-8 19-17 19S15 32 15 21z" fill="url(#${id})"/><rect x="28" y="40" width="8" height="12" fill="url(#${id})"/><path d="M20 52h24l3 9H17z" fill="url(#${id})"/><rect x="13" y="61" width="38" height="13" rx="2" fill="#5a3b25"/><path d="M32 12l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z" fill="rgba(255,255,255,.75)"/></svg>`;
}
const tier = (c) => (c.g == "A" && c.r == 1 ? "plat" : c.r == 1 ? "gold" : c.r == 2 ? "silver" : c.r == 3 ? "bronze" : "part");
function ring(v, tot, k, col) {
  const p = tot ? Math.min(1, v / tot) : 0, C = 2 * Math.PI * 26, d = mk("div", "ring");
  d.innerHTML = `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#33343d" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="800" fill="#f1f1f4">${Math.round(p * 100)}%</text></svg>`;
  d.append(mk("div", "v", `${fmt(v)} / ${fmt(tot)}`), mk("div", "k", k)); return d;
}
function row(left, t1, t2, right) {
  const r = mk("div", "row"); if (left) r.append(left);
  const t = mk("div", "t"); t.append(mk("div", "t1", t1)); if (t2) t.append(mk("div", "t2", t2)); r.append(t);
  if (right) r.append(right); return r;
}
function render(S) {
  $("#err").hidden = true; $("#app").hidden = false;
  const age = (Date.now() - new Date(S.generated)) / 36e5, up = $("#up");
  up.replaceChildren(mk("div", "", "Cập nhật " + when(S.generated)));
  if (age > 24 * 14) { up.lastChild.className = "stale"; up.append(mk("div", "stale", "hơn 2 tuần, nhớ xuất lại")); }
  $("#carat").textContent = fmt(S.carat); $("#tu").textContent = fmt(S.ticket_uma); $("#ts").textContent = fmt(S.ticket_sup);
  const ol = $("#outlook"); ol.replaceChildren();
  if (S.low6) ol.append(mk("span", "", `Thấp nhất 6 tháng: ${fmt(S.low6.bal)} (${dm(S.low6.day)})`));
  ol.append(mk("span", S.neg_day ? "neg" : "", S.neg_day ? `Âm carat từ ${dm(S.neg_day)}/${S.neg_day.slice(0, 4)}` : "Không âm carat trong sổ"));
  spark(S);

  const n = S.next_pull, nx = $("#next"); nx.replaceChildren();
  if (n) {
    const c = mk("div", "next"); c.append(bannerVisual(n, "bnw"));
    const inn = mk("div", "in"), t = mk("div", "t"); t.append(mk("b", "", n.cards), mk("span", "", `${n.type} · ${fmt(n.pulls)} lượt · đến ${dm(n.end)}`));
    const d = days(n.start), cd = mk("div", "cd"); cd.append(mk("b", "", String(d > 0 ? d : Math.max(0, days(n.end)))), mk("span", "", d > 0 ? "ngày nữa mở" : "ngày còn lại"));
    inn.append(t, cd); c.append(inn); nx.append(c);
  } else $("#secNext").hidden = true;

  const bl = $("#banners"); bl.replaceChildren();
  for (const b of S.banners) {
    const c = mk("div", "bc"), im = bannerVisual(b, "im"), tg = mk("div", "tg");
    tg.append(mk("span", "pill " + (b.type === "Uma" ? "u" : "s"), b.type.toUpperCase())); if (b.pull) tg.append(mk("span", "pill pull", "PULL")); if (b.est) tg.append(mk("span", "pill", "dự kiến"));
    im.append(tg); const run = days(b.start) <= 0, bd = mk("div", "bd");
    bd.append(mk("b", "", b.cards), mk("span", "", `${dm(b.start)} → ${dm(b.end)} · ${run ? `còn ${Math.max(0, days(b.end))} ngày` : `${days(b.start)} ngày nữa`}`));
    c.append(im, bd); bl.append(c);
  }

  const gl = $("#goals"); gl.replaceChildren();
  if (!S.goals.length) gl.append(row(null, "Chưa có thẻ mục tiêu", null, null));
  for (const g of S.goals) {
    const r = mk("div", "r"); r.append(mk("b", "", fmt(g.left)));
    const cls = g.status === "Đủ" ? (g.left < 10000 ? "warn" : "ok") : String(g.status).startsWith("Thiếu") ? "bad" : "";
    r.append(mk("span", "tag " + cls, g.status || "—"));
    gl.append(row(img(cardSrc(g.id, true), "art"), String(g.name).replace(/\s*#\d+$/, ""), g.pull ? `Pull ${dm(g.pull)} · còn ${days(g.pull)} ngày` : "Chưa có banner", r));
  }

  const rg = $("#rings"); rg.replaceChildren(ring(S.uma_owned, S.uma_global, "Uma đã có", "#ff6aa9"), ring(S.ssr_total, Object.values(S.types || {}).reduce((a, x) => a + x[1], 0) || S.ssr_total, "SSR đã có", "#5aa8ff"), ring(S.ssr_mlb, S.ssr_total, "SSR MLB", "#ffc83d"));
  const ty = $("#types"); ty.replaceChildren();
  TYPES.forEach(([t, col], i) => {
    const v = (S.types || {})[t]; if (!v) return;
    const d = mk("div", "ty"); d.style.setProperty("--c", col);
    d.append(img(`${GT}icons/utx_ico_obtain_0${i}.png`)); const b = mk("b", "", String(v[0])); b.append(mk("small", "", "/" + v[1])); d.append(b, mk("div", "k", t));
    const pb = mk("div", "pb"), ii = mk("i"); ii.style.width = (v[1] ? (v[0] / v[1]) * 100 : 0) + "%"; pb.append(ii); d.append(pb); ty.append(d);
  });

  const cm = S.cm || [], sh = $("#shelf"); sh.replaceChildren();
  for (const c of cm.slice().reverse()) { const d = mk("div", "tro"); d.innerHTML = trophy(tier(c)); d.append(mk("span", "", "CM " + c.id)); d.title = `${c.cup} · ${c.g ? "Group " + c.g + " · " : ""}hạng ${c.r}`; sh.append(d); }
  const plat = cm.filter((c) => tier(c) === "plat").length, win = cm.filter((c) => c.r == 1).length, last = cm[cm.length - 1];
  $("#cst").innerHTML = `<div><b>${plat}</b><span>Platinum</span></div><div><b>${cm.length ? Math.round((win / cm.length) * 100) : 0}%</b><span>Vô địch</span></div><div><b>${last ? "CM " + last.id : "—"}</b><span>${last ? (last.g ? "Group " + last.g + " · " : "") + "hạng " + last.r : ""}</span></div>`;
  const rk = $("#ranks"); rk.replaceChildren();
  for (const [k, v] of Object.entries(S.ranks || {})) { const c = mk("div", "rk"); c.append(mk("div", "k", k), mk("div", "v", v || "—")); rk.append(c); }
  const pv = $("#pvp"); pv.replaceChildren();
  for (const p of S.pvp) {
    const ic = mk("div", "ic", p.kind); ic.style.background = p.kind === "CM" ? "linear-gradient(135deg,#ffd76a,#c08a1e)" : "linear-gradient(135deg,#c3a2ff,#7550d6)";
    const r = mk("div", "r"), d = days(p.start); r.append(mk("b", "", d > 0 ? `${d} ngày` : "Đang diễn ra"), mk("div", "", `${dm(p.start)} → ${dm(p.end)}`));
    pv.append(row(ic, `${p.kind} ${p.no ?? ""} · ${p.name}`, p.track, r));
  }
  $("#foot").textContent = (S.excel_saved ? `Excel lưu ${when(S.excel_saved)} · ` : "") + "Ảnh: GameTora, umamusu.wiki · Fan project cá nhân";
}
fetch("summary.json?t=" + Date.now(), { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(render)
  .catch(() => { $("#err").textContent = "Chưa có dữ liệu. Máy tính chưa gửi bản tóm tắt nào."; });
</script>
</body>
</html>
